<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Radeem App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Reset Password</h2>
            <p>We will send you instructions to reset your password</p>
        </div>

        <div id="alert-box" class="alert hidden"></div>

        <form id="forgot-form" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your registered email" required>
            </div>
            <button type="submit" id="btn-reset" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <p class="auth-footer">
            Remembered your password? <a href="login.html">Back to Login</a>
        </p>
    </div>

    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn-reset');
            
            btn.disabled = true;
            btn.innerText = 'Sending...';
            
            try {
                await resetPassword(email);
                showAlert('Password reset email sent! Check your inbox.', 'success');
                btn.innerText = 'Sent!';
            } catch (error) {
                showAlert(error.message, 'error');
                btn.disabled = false;
                btn.innerText = 'Send Reset Link';
            }
        });

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerText = msg;
            alertBox.className = `alert ${type}`;
            alertBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
