<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Radeem App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%234F46E5%22/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <svg class="logo-icon" style="width: 60px; height: 60px; margin: 0 auto;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <h2 class="auth-title">Reset Password</h2>
          <p class="auth-subtitle">Enter your email to receive a reset link</p>
        </div>

        <form id="reset-form" onsubmit="handleReset(event)">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="reset-email" class="form-input" placeholder="name@example.com" required>
            </div>
          </div>

          <button type="submit" id="reset-btn" class="btn-primary">
            Send Reset Link
          </button>
        </form>

        <div class="auth-footer">
          Remembered your password? <a href="login.html" class="auth-link">Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="firebase.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    async function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const btn = document.getElementById('reset-btn');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      const result = await sendPasswordReset(email);
      if (result.success) {
        showToast("Password reset email sent! Check your inbox.", "success");
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } else {
        showToast(result.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }
  </script>
</body>
</html>
