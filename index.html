<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Radeem App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🎁</div>
      <h1>Welcome Back</h1>
      <p>Log in to continue earning premium rewards</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <div style="text-align: right; margin-bottom: 1.5rem;">
          <a href="#" id="forgot-password-link" style="color: var(--primary); font-size: 0.85rem; font-weight: 700; text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Log In</button>
      </form>

      <button id="guest-login-btn" class="btn btn-guest">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Play as Guest
      </button>

      <div class="divider">or</div>

      <button id="google-signin-btn" class="btn btn-google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
        Sign in with Google
      </button>

      <p style="margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Register</a>
      </p>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script type="module">
    import { loginUser, loginWithGoogle, loginAsGuest, resetPassword, checkAuthState } from './auth.js';

    const loginForm = document.getElementById('login-form');
    const googleBtn = document.getElementById('google-signin-btn');
    const guestBtn = document.getElementById('guest-login-btn');
    const forgotLink = document.getElementById('forgot-password-link');
    const toast = document.getElementById('toast');

    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.style.borderLeft = isError ? '4px solid var(--danger)' : '4px solid var(--success)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    checkAuthState((user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const res = await loginUser(email, password);
      if (res.success) {
        showToast('Login successful! Redirecting...');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        showToast(res.error, true);
      }
    });

    googleBtn.addEventListener('click', async () => {
      const res = await loginWithGoogle();
      if (res.success) {
        showToast('Google Login successful!');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        showToast(res.error, true);
      }
    });

    guestBtn.addEventListener('click', async () => {
      const res = await loginAsGuest();
      if (res.success) {
        showToast('Logged in as Guest! Redirecting...');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        showToast(res.error, true);
      }
    });

    forgotLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) {
        showToast('Please enter your email address first.', true);
        return;
      }
      const res = await resetPassword(email);
      if (res.success) {
        showToast('Password reset email sent!');
      } else {
        showToast(res.error, true);
      }
    });
  </script>
</body>
</html>
