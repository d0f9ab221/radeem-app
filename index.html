<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radeem App - Premium Rewards</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="landing-body">
    <div class="landing-container">
        <div class="logo-section">
            <div class="logo-glow"></div>
            <img src="https://image.pollinations.ai/prompt/premium%20gold%20and%20diamond%20reward%20gift%20box%203d%20render%20isolated" alt="Radeem Logo" class="landing-logo">
            <h1 class="app-title">Radeem</h1>
            <p class="app-subtitle">Earn Rewards, Open Mystery Boxes & Redeem Cash</p>
        </div>

        <div class="features-carousel">
            <div class="feature-card">
                <div class="feature-icon">💎</div>
                <h3>Watch & Earn</h3>
                <p>Get instant diamonds for watching premium short ads.</p>
            </div>
        </div>

        <div class="landing-actions">
            <a href="login.html" class="btn btn-primary btn-block">Get Started</a>
            <a href="register.html" class="btn btn-secondary btn-block">Create Account</a>
        </div>
    </div>

    <script src="firebase.js"></script>
    <script>
        // Auto redirect if already logged in
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
