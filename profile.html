<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Radeem App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-body">
    <!-- Top Header -->
    <header class="app-header">
        <div class="header-title-only">
            <h2>My Profile</h2>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-content profile-content">
        <div class="profile-card-main">
            <div class="profile-avatar-container">
                <img id="profile-avatar" src="https://image.pollinations.ai/prompt/minimalist%20cute%203d%20avatar%20boy%20smiling" alt="Avatar" class="profile-avatar">
                <button class="edit-avatar-btn" id="edit-avatar-btn">
                    <i data-lucide="camera"></i>
                </button>
            </div>
            <h3 id="profile-username">Loading...</h3>
            <p id="profile-email" class="profile-email">Loading...</p>
            <span class="join-date" id="profile-join-date">Joined: --/--/----</span>
        </div>

        <!-- Edit Profile Form -->
        <div class="profile-section-card">
            <h3>Edit Profile</h3>
            <div id="profile-alert" class="alert hidden"></div>
            <form id="edit-profile-form">
                <div class="form-group">
                    <label for="edit-username">Username</label>
                    <input type="text" id="edit-username" placeholder="Enter new username" required>
                </div>
                <button type="submit" id="btn-save-profile" class="btn btn-primary btn-block">Save Changes</button>
            </form>
        </div>

        <!-- Stats Summary -->
        <div class="profile-section-card">
            <h3>Your Statistics</h3>
            <div class="profile-stats-grid">
                <div class="p-stat-item">
                    <span class="p-stat-icon">🪙</span>
                    <span class="p-stat-val" id="p-coins">0</span>
                    <span class="p-stat-lbl">Coins</span>
                </div>
                <div class="p-stat-item">
                    <span class="p-stat-icon">💎</span>
                    <span class="p-stat-val" id="p-diamonds">0</span>
                    <span class="p-stat-lbl">Diamonds</span>
                </div>
                <div class="p-stat-item">
                    <span class="p-stat-icon">🎁</span>
                    <span class="p-stat-val" id="p-redeems">0</span>
                    <span class="p-stat-lbl">Redeems</span>
                </div>
            </div>
        </div>

        <!-- Logout Button -->
        <div class="logout-container">
            <button id="btn-logout" class="btn btn-danger btn-block">
                <i data-lucide="log-out"></i> Logout Account
            </button>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="window.location.href='dashboard.html'">
            <i data-lucide="home"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="window.location.href='dashboard.html?tab=earn'">
            <i data-lucide="tv"></i>
            <span>Earn</span>
        </button>
        <button class="nav-item" onclick="window.location.href='dashboard.html?tab=box'">
            <i data-lucide="gift"></i>
            <span>Box</span>
        </button>
        <button class="nav-item" onclick="window.location.href='redeem.html'">
            <i data-lucide="award"></i>
            <span>Redeem</span>
        </button>
        <button class="nav-item active">
            <i data-lucide="user"></i>
            <span>Profile</span>
        </button>
    </nav>

    <script src="firebase.js"></script>
    <script src="database.js"></script>
    <script src="auth.js"></script>
    <script>
        lucide.createIcons();

        // Load Profile Data
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Sync user data in real-time
            syncUserData(user.uid, (data) => {
                if (data) {
                    document.getElementById('profile-username').innerText = data.username || 'User';
                    document.getElementById('profile-email').innerText = data.email;
                    document.getElementById('edit-username').value = data.username || '';
                    document.getElementById('p-coins').innerText = data.coins || 0;
                    document.getElementById('p-diamonds').innerText = data.diamonds || 0;
                    
                    if (data.createdAt) {
                        const date = new Date(data.createdAt);
                        document.getElementById('profile-join-date').innerText = `Joined: ${date.toLocaleDateString()}`;
                    }
                }
            });

            // Get total redeems count
            firebase.database().ref(`redeemRequests`).orderByChild('uid').equalTo(user.uid)
                .on('value', (snapshot) => {
                    const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
                    document.getElementById('p-redeems').innerText = count;
                });
        });

        // Handle Profile Edit Form
        document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newUsername = document.getElementById('edit-username').value;
            const btn = document.getElementById('btn-save-profile');
            const alertBox = document.getElementById('profile-alert');
            
            btn.disabled = true;
            btn.innerText = 'Saving...';
            
            try {
                const user = firebase.auth().currentUser;
                await firebase.database().ref(`users/${user.uid}`).update({
                    username: newUsername
                });
                alertBox.innerText = 'Profile updated successfully!';
                alertBox.className = 'alert success';
                alertBox.classList.remove('hidden');
            } catch (error) {
                alertBox.innerText = error.message;
                alertBox.className = 'alert error';
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Save Changes';
                setTimeout(() => alertBox.classList.add('hidden'), 3000);
            }
        });

        // Handle Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await logoutUser();
        });
    </script>
</body>
</html>
