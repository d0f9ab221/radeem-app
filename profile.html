<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Radeem App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%234F46E5%22/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
        <span class="logo-text">Radeem</span>
      </div>
      <button onclick="logoutUser()" class="balance-badge" style="background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-light); cursor: pointer;">
        Logout
      </button>
    </header>

    <!-- Main Content -->
    <main class="content-area">
      <div class="profile-card">
        <div class="profile-avatar-wrapper" id="profile-avatar-container">
          <!-- Avatar rendered dynamically -->
        </div>
        
        <div id="profile-display-group">
          <h2 class="profile-name" id="profile-name">Loading...</h2>
          <p class="profile-email" id="profile-email">...</p>
          <button id="edit-profile-btn" class="btn-primary" style="margin-top: 15px; padding: 8px 16px; font-size: 0.85rem; width: auto; display: inline-flex;">
            Edit Profile
          </button>
        </div>

        <!-- Edit Profile Form (Hidden by default) -->
        <div id="profile-edit-form" class="hidden" style="margin-top: 15px;">
          <div class="form-group">
            <input type="text" id="edit-username" class="form-input" style="padding: 10px 14px;" placeholder="New Username">
          </div>
          <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="save-profile-btn" class="btn-primary" style="padding: 8px 16px; font-size: 0.85rem; width: auto;">Save</button>
            <button onclick="document.getElementById('profile-display-group').classList.remove('hidden'); document.getElementById('profile-edit-form').classList.add('hidden');" class="btn-google" style="padding: 8px 16px; font-size: 0.85rem; width: auto;">Cancel</button>
          </div>
        </div>

        <div class="profile-stats-grid">
          <div class="profile-stat-card">
            <div class="profile-stat-val" id="profile-coins">0</div>
            <div class="profile-stat-lbl">Coins</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-val" id="profile-diamonds">0</div>
            <div class="profile-stat-lbl">Diamonds</div>
          </div>
        </div>

        <div class="profile-info-list">
          <div class="profile-info-item">
            <span class="profile-info-lbl">Joined On</span>
            <span class="profile-info-val" id="profile-join-date">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-lbl">Status</span>
            <span class="profile-info-val" style="color: var(--success);">Active Member</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </a>
      <a href="dashboard.html#earn" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Earn</span>
      </a>
      <a href="dashboard.html#box" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
          <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
        <span>Box</span>
      </a>
      <a href="redeem.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
        <span>Redeem</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="firebase.js"></script>
  <script src="auth.js"></script>
  <script src="database.js"></script>
  <script src="app.js"></script>
</body>
</html>
