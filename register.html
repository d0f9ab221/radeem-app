<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Radeem App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <span>🎁</span> Radeem App
    </a>
    <div class="nav-links">
      <a href="login.html" class="nav-link">Login</a>
    </div>
  </nav>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Start earning free redeem codes today</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="johndoe" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>

      <div class="divider">or</div>

      <button id="google-signin-btn" class="btn btn-google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
        Sign up with Google
      </button>

      <p style="margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Log In</a>
      </p>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script type="module">
    import { registerUser, loginWithGoogle, checkAuthState } from './auth.js';

    const registerForm = document.getElementById('register-form');
    const googleBtn = document.getElementById('google-signin-btn');
    const toast = document.getElementById('toast');

    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.style.borderLeft = isError ? '4px solid var(--danger)' : '4px solid var(--success)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    checkAuthState((user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const res = await registerUser(email, password, username);
      if (res.success) {
        showToast('Registration successful! Redirecting...');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        showToast(res.error, true);
      }
    });

    googleBtn.addEventListener('click', async () => {
      const res = await loginWithGoogle();
      if (res.success) {
        showToast('Google Registration successful!');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        showToast(res.error, true);
      }
    });
  </script>
</body>
</html>
