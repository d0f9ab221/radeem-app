<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Radeem App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%234F46E5%22/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <svg class="logo-icon" style="width: 60px; height: 60px; margin: 0 auto;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
          <h2 class="auth-title">Create Account</h2>
          <p class="auth-subtitle">Join us and start earning rewards</p>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label">Username</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="register-username" class="form-input" placeholder="John Doe" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="register-email" class="form-input" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="register-password" class="form-input" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="register-btn" class="btn-primary">
            Register
          </button>
        </form>

        <div class="divider">or continue with</div>

        <button type="button" onclick="handleGoogleSignIn()" class="btn-google">
          <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.103C18.22 1.824 15.47 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.986 0-.743-.08-1.3-.176-1.852H12.24z"/>
          </svg>
          Google
        </button>

        <div class="auth-footer">
          Already have an account? <a href="login.html" class="auth-link">Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="firebase.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    checkAuthState(false, 'dashboard.html');

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('register-username').value.trim();
      const email = document.getElementById('register-email').value.trim();
      const password = document.getElementById('register-password').value;
      const btn = document.getElementById('register-btn');

      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      const result = await registerWithEmail(email, password, username);
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        showToast(result.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    }

    async function handleGoogleSignIn() {
      const result = await signInWithGoogle();
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        showToast(result.message, 'error');
      }
    }
  </script>
</body>
</html>
